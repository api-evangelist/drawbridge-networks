name: Drawbridge Networks
description: >-
  Drawbridge Networks was a network microsegmentation cybersecurity startup founded in 2014 in New York
  by John Terrill and Tom Cross. Its product, PathProtect, applied fine-grained, identity- and workload-aware
  security policies inside corporate networks to learn, detect, and automatically quarantine lateral
  (east-west) attacker movement before it could spread. The company raised a $1.7M seed round from Antecedent
  Ventures, Bloomberg Beta, and Bowery Capital, and was acquired by OPAQ Networks in May 2017 (OPAQ was
  itself later acquired by Fortinet in 2020). Drawbridge Networks was surfaced as a Bloomberg Beta portfolio
  company and added to the API Evangelist network as a stub. Enrichment finds the company defunct: no domains
  resolve, and there is no live developer portal, documentation, or public API surface to catalog.
